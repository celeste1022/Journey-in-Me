const groups=[{name:'Limited Release',short:'Limited',sub:'Small editions. Special places in your collection.',items:[['Karma','Khyentse Norbu',1,198,126],['Let it go','Krishnamurti',3,84,62],['The quiet within','Mira Sol',5,36,28]]},{name:'Nature Sounds',short:'Nature',sub:'A little closer to the outside world.',items:[['Mountains','Nature Sounds',0,64,72],['Rain in the forest','Nature Sounds',3,82,95],['Sea','Nature Sounds',2,112,98],['Winter fire','Nature Sounds',4,41,27]]},{name:'Music',short:'Music',sub:'Sounds to settle into.',items:[['Sufi chanting','Amina Noor',5,47,39],['Focus','Studio Still',7,52,46],['Ambient sound','Luna & Sea',8,71,48]]},{name:'Practice',short:'Practice',sub:'Rituals, one day at a time.',items:[['7 days of yoga','7-day practice · Maya',1,18,12],['21 days of healing','21-day practice · Annie',4,24,18],['14 days of affirmation','14-day practice · Mira',3,16,8]]},{name:'My Album',short:'My Album',sub:'Made by you. For your own rhythm.',items:[['My slow mornings','By Linghui · 6 sounds',0,24,17],['A softer night','By Linghui · 4 sounds',2,31,22],['Sunday rituals','By Linghui · 8 sounds',4,12,9]]}];
let all=[];groups.forEach((g,gi)=>g.items=g.items.map((x,i)=>{let a={id:gi+'-'+i,title:x[0],by:x[1],seed:x[2],days:x[3],hours:x[4],category:g.name,album:gi===4};all.push(a);return a}));const favs=[{id:'f1',title:'Care',by:'',seed:1,days:164,hours:143,category:'Music'},{id:'f0',title:'The Wind',by:'',seed:2,days:198,hours:189,category:'Nature Sounds'},{id:'f2',title:'Great Mother',by:'',seed:3,days:122,hours:128,category:'Practice'}];all.push(...favs);
const card=a=>`<button class="item" data-id="${a.id}" aria-label="View ${a.title}"><div class="cover">${art(a.seed,a.title,a.album)}</div><h3>${a.title}</h3><p class="by">${a.by}</p>${a.category==='Limited Release'?'<span class="label">✧ Limited release</span>':''}</button>`;
document.querySelector('#favs').innerHTML=favs.map(a=>`<button class="fav" data-id="${a.id}" aria-label="View ${a.title}"><div class="cover">${art(a.seed,a.title)}</div><h3>${a.title}</h3><div class="stat"><b>${a.days}</b> days together<br><b>${a.hours}</b> hours played</div></button>`).join('');
document.querySelector('.nav').innerHTML=groups.map((g,i)=>`<button data-scroll="g${i}" ${i===0?'class="active"':''}>${g.short}</button>`).join('');document.querySelector('#sections').innerHTML=groups.map((g,i)=>`<section class="section" data-kind="${g.name}" id="g${i}"><div class="heading"><div><h2>${g.name}</h2><p>${g.sub}</p></div><button class="view" data-group="${i}">View all ↗</button></div><div class="rail">${g.items.map(card).join('')}</div></section>`).join('');
const overlay=document.querySelector('#overlay'),content=document.querySelector('#sheet-content');let previousFocus,playing=false;
function open(html){previousFocus=document.activeElement;content.innerHTML=html;overlay.classList.add('open');document.body.style.overflow='hidden';document.querySelector('.sheet').scrollTop=0;document.querySelector('.close').focus()}
function close(){overlay.classList.remove('open');document.body.style.overflow='';overlay.classList.remove('playing');playing=false;previousFocus?.focus()}
function detail(id){showAlbum(id)}
function grid(index){let g=groups[index];open(`<h2 class="collection-title">${g.name}</h2><p class="sheet-subtitle">${g.items.length} collected · Recently added first</p><div class="grid">${g.items.map(card).join('')}</div>`)}
function search(){open('<h2 class="collection-title">Your collection</h2><p class="sheet-subtitle">Find something you love.</p><input id="query" aria-label="Search title or creator" placeholder="Search title or creator…"><div class="grid" id="results">'+all.map(card).join('')+'</div>');document.querySelector('#query').focus();document.querySelector('#query').oninput=e=>{let q=e.target.value.toLowerCase();let a=all.filter(x=>(x.title+' '+x.by).toLowerCase().includes(q));document.querySelector('#results').innerHTML=a.length?a.map(card).join(''):'<div class="empty" style="grid-column:1/-1"><h3>Nothing found yet.</h3><p>Try another title or creator.</p></div>'}}
document.addEventListener('click',e=>{let c=e.target.closest('[data-id]');if(c){detail(c.dataset.id);return}let g=e.target.closest('[data-group]');if(g){grid(+g.dataset.group);return}let n=e.target.closest('[data-scroll]');if(n){return}if(e.target.closest('#preview')){playing=!playing;overlay.classList.toggle('playing',playing);document.querySelector('#preview').textContent=playing?'Ⅱ Pause preview':'▷ Preview the experience'}});
document.querySelector('.search').onclick=search;document.addEventListener('keydown',e=>{if(!overlay.classList.contains('open'))return;if(e.key==='Escape')close();if(e.key==='Tab'){let f=[...overlay.querySelectorAll('button,input')],first=f[0],last=f.at(-1);if(e.shiftKey&&document.activeElement===first){e.preventDefault();last.focus()}else if(!e.shiftKey&&document.activeElement===last){e.preventDefault();first.focus()}}});
const app=document.querySelector('.app'), nav=document.querySelector('.nav');
const tabs=[{name:'Favourite',short:'Favourites',icon:'✧',items:[favs[1],favs[0],favs[2]]},...groups.map((g,i)=>({...g,icon:['◈','⌁','◎','◷','▧'][i]}))];
let currentTab=0,positions=tabs.map(()=>0),lastTurn=0,sourceCard=null,transitionBusy=false;
nav.innerHTML=tabs.map((g,i)=>`<button data-tab="${i}" class="${i===0?'active':''}" aria-pressed="${i===0}"><span class="tab-icon" aria-hidden="true">${g.icon}</span>${g.short}</button>`).join('');
const stage=document.createElement('div');stage.className='collection-stage';stage.tabIndex=0;stage.setAttribute('aria-label','Record collection. Swipe left or right, or use left and right arrow keys to browse.');app.append(stage);
const info=document.createElement('div');info.className='record-info';info.setAttribute('aria-live','polite');app.append(info);
const hint=document.createElement('p');hint.className='open-hint';hint.textContent='';app.append(hint);
const bottom=document.createElement('div');bottom.className='bottom-bar';app.append(bottom);
const colors={'Music':'#798d9c','Nature Sounds':'#7a9072','Practice':'#b28167','My Album':'#999071','Limited Release':'#a38b58'};
function typeOf(a){return a.category==='Limited Release'?'Music':a.category}
function render(updateStage=true){const group=tabs[currentTab],index=positions[currentTab],a=group.items[index];if(updateStage)stage.innerHTML='<div class="stage-halo"></div>'+group.items.map((r,i)=>`<button class="record ${i===index?'current':i===index-1?'previous':i===index+1?'next':i<index?'hidden-before':'hidden-after'}" data-record="${i}" aria-label="${i===index?'Open':'Select'} ${r.title}" tabindex="${Math.abs(i-index)<=1?0:-1}" style="--type-color:${colors[typeOf(r)]}"><div class="sleeve"><div class="cover">${art(r.seed,r.title,r.album)}</div><span class="spine-mark"></span>${r.category==='Limited Release'?'<span class="record-note">LIMITED</span>':''}</div></button>`).join('')+`<div class="stage-controls"><button id="prev-record" aria-label="Previous record" ${index===0?'disabled':''}>←</button><button id="next-record" aria-label="Next record" ${index===group.items.length-1?'disabled':''}>→</button></div>`;
info.innerHTML=`<span class="type-tag" style="--type-color:${colors[typeOf(a)]}">${typeOf(a)}${a.album?' · Made by you':''}</span><h2>${a.title}</h2><p>${a.by}</p>${currentTab===0?`<div class="record-stats"><span><strong>${a.days}</strong> days together</span><span><strong>${a.hours}</strong> hours played</span></div>`:''}`;
bottom.innerHTML=``;
}
function turn(delta){if(overlay.classList.contains('open'))return;let next=Math.max(0,Math.min(tabs[currentTab].items.length-1,positions[currentTab]+delta));if(next===positions[currentTab])return;positions[currentTab]=next;const old=[...stage.querySelectorAll('.record')];const group=tabs[currentTab];old.forEach((el,i)=>{el.className='record '+(i===next?'current':i===next-1?'previous':i===next+1?'next':i<next?'hidden-before':'hidden-after');el.tabIndex=Math.abs(i-next)<=1?0:-1;el.setAttribute('aria-label',(i===next?'Open ':'Select ')+group.items[i].title)});render(false);stage.querySelector('#prev-record').disabled=next===0;stage.querySelector('#next-record').disabled=next===group.items.length-1;}
// Keep the record nodes mounted so their position transitions can run.
function move(delta){turn(delta)}
nav.addEventListener('click',e=>{let b=e.target.closest('[data-tab]');if(!b)return;currentTab=+b.dataset.tab;nav.querySelectorAll('button').forEach((n,i)=>{n.classList.toggle('active',i===currentTab);n.setAttribute('aria-pressed',String(i===currentTab))});b.scrollIntoView({behavior:'smooth',block:'nearest',inline:'center'});render()});
let down=null,suppressClick=false,gestureFrom=null;
function resetDrag(){const c=stage.querySelector('.record.current');if(c)c.style.translate='';}
stage.addEventListener('pointerdown',e=>{if(transitionBusy||e.target.closest('.stage-controls'))return;down={y:e.clientY,x:e.clientX};suppressClick=false});
stage.addEventListener('pointermove',e=>{if(!down)return;const dy=e.clientY-down.y,dx=e.clientX-down.x;if(dy < -8 && Math.abs(dy)>Math.abs(dx)){const c=stage.querySelector('.record.current');c.style.translate=`0px ${Math.max(-95,dy*.5)}px`;}});
stage.addEventListener('pointerup',e=>{if(!down)return;let d=e.clientX-down.x,dy=e.clientY-down.y;down=null;if(Math.abs(d)>35&&Math.abs(d)>Math.abs(dy)){resetDrag();suppressClick=true;move(d<0?1:-1);setTimeout(()=>suppressClick=false,250)}else if(dy < -45 && Math.abs(dy)>Math.abs(d)){gestureFrom=stage.querySelector('.record.current .cover').getBoundingClientRect();suppressClick=true;unfold();setTimeout(()=>suppressClick=false,250)}else{resetDrag()}});
stage.addEventListener('pointercancel',()=>{down=null;resetDrag()});
stage.addEventListener('wheel',e=>{e.preventDefault();if(Date.now()-lastTurn<550||Math.max(Math.abs(e.deltaX),Math.abs(e.deltaY))<10)return;lastTurn=Date.now();move((Math.abs(e.deltaX)>Math.abs(e.deltaY)?e.deltaX:e.deltaY)>0?1:-1)},{passive:false});stage.addEventListener('keydown',e=>{if(['ArrowRight','ArrowLeft'].includes(e.key)){e.preventDefault();move(e.key==='ArrowRight'?1:-1)}});
function fly(from,to,html,done){if(matchMedia('(prefers-reduced-motion:reduce)').matches){done();return}const el=document.createElement('div');el.className='cover-flight';el.innerHTML=html;Object.assign(el.style,{left:from.x+'px',top:from.y+'px',width:from.width+'px',height:from.height+'px'});document.body.append(el);const a=el.animate([{transform:'translate(0,0) scale(1)'},{transform:`translate(${to.x-from.x}px,${to.y-from.y}px) scale(${to.width/from.width},${to.height/from.height})`}],{duration:420,easing:'cubic-bezier(.22,.8,.25,1)',fill:'forwards'});el.style.transformOrigin='top left';a.onfinish=()=>{el.remove();done()}}

let activeAlbum=null,albumFlipped=false;
function backArt(a){const [bg,ink,light]=palettes[a.seed%6];return `<svg viewBox="0 0 200 200" aria-label="${a.title} album reverse"><rect width="200" height="200" fill="${bg}"/><rect x="10" y="10" width="180" height="180" fill="none" stroke="${light}"/><circle cx="100" cy="53" r="18" fill="none" stroke="${ink}"/><circle cx="100" cy="53" r="4" fill="${ink}"/><text x="100" y="91" fill="${ink}" text-anchor="middle" font-family="Georgia" font-size="14">${a.title}</text><text x="100" y="108" fill="${ink}" text-anchor="middle" font-family="sans-serif" font-size="7">${typeOf(a)}</text><path d="M44 124h112M61 132h78M55 140h90" stroke="${ink}" opacity=".35"/></svg>`}
function flipFlight(from,to,a,reverse,done){if(matchMedia('(prefers-reduced-motion:reduce)').matches){done();return}const el=document.createElement('div');el.className='flip-flight';el.innerHTML=`<div class="flip-inner"><div class="flip-face front">${art(a.seed,a.title,a.album)}</div><div class="flip-face rear">${backArt(a)}</div></div>`;Object.assign(el.style,{left:from.x+'px',top:from.y+'px',width:from.width+'px',height:from.height+'px'});document.body.append(el);const timing={duration:650,easing:'cubic-bezier(.22,.75,.22,1)',fill:'forwards'};el.animate([{transform:'translate(0,0) scale(1)'},{transform:`translate(${to.x-from.x}px,${to.y-from.y}px) scale(${to.width/from.width},${to.height/from.height})`}],timing);const anim=el.firstChild.animate([{transform:`rotateY(${reverse&&albumFlipped?180:0}deg)`},{transform:'rotateY(0deg)'}],timing);anim.onfinish=()=>{el.remove();done()}}
function showAlbum(id){if(transitionBusy)return;const a=all.find(x=>x.id===id);activeAlbum=a;albumFlipped=false;
let idx=tabs[currentTab].items.findIndex(x=>x.id===id);if(idx<0){currentTab=tabs.findIndex(t=>t.items.some(x=>x.id===id));idx=tabs[currentTab].items.findIndex(x=>x.id===id);nav.querySelectorAll('button').forEach((n,i)=>{n.classList.toggle('active',i===currentTab);n.setAttribute('aria-pressed',String(i===currentTab))})}positions[currentTab]=idx;render();sourceCard=stage.querySelector('.record.current');const rect=gestureFrom||sourceCard.querySelector('.cover').getBoundingClientRect();gestureFrom=null;
open(`<div class="album-page"><header class="album-header"><button id="album-back" aria-label="Back to collection">←</button><span>Album</span></header><button class="album-reverse" id="flip-album" aria-label="Flip album to back" aria-pressed="false"><span class="album-turn"><span class="album-side album-front">${art(a.seed,a.title,a.album)}</span><span class="album-side album-back">${backArt(a)}</span></span></button><div class="album-copy"><span class="type-tag" style="--type-color:${colors[typeOf(a)]}">${typeOf(a)}</span><h2>${a.title}</h2>${a.by?`<p class="artist">${a.by}</p>`:''}<section class="album-facts"><h3>Album information</h3><dl><div><dt>Category</dt><dd>${typeOf(a)}</dd></div>${a.category==='Limited Release'?'<div><dt>Edition</dt><dd>Limited release</dd></div>':''}${a.album?'<div><dt>Created by</dt><dd>Linghui</dd></div>':''}<div><dt>Format</dt><dd>${a.album?'Personal playlist':a.category==='Practice'?'Practice course':'Album'}</dd></div></dl></section><section class="album-card-list"><h3>Card list</h3><ol>${[{name:a.title+' · Opening',time:'5 min'},{name:a.title+' · Practice',time:'10 min'},{name:a.title+' · Closing',time:'3 min'}].map((card,i)=>`<li><div class="card-thumb">${art(a.seed+i,card.name,a.album)}</div><div class="card-label"><h4>${card.name}</h4>${a.by?`<p>${a.by}</p>`:''}</div><span class="card-duration">${card.time}</span></li>`).join('')}</ol></section><section class="practice-info"><h3>Your practice</h3><div class="metrics"><div><strong>${a.days}</strong>days practised</div><div><strong>${a.hours}</strong>hours played</div></div><h4>Recent practice</h4><div class="practice-row"><span>September 30<small>7:30 AM</small></span><span>18 min</span></div><div class="practice-row"><span>September 28<small>9:00 PM</small></span><span>24 min</span></div><div class="practice-row"><span>September 26<small>8:15 AM</small></span><span>12 min</span></div></section></div></div>`);
const sh=document.querySelector('.sheet');sh.classList.add('album-full');transitionBusy=true;sourceCard.style.visibility='hidden';requestAnimationFrame(()=>{flipFlight(rect,document.querySelector('.album-reverse').getBoundingClientRect(),a,false,()=>{sh.classList.add('album-settled');transitionBusy=false})});document.querySelector('#flip-album').onclick=()=>{if(transitionBusy)return;albumFlipped=!albumFlipped;const c=document.querySelector('#flip-album');c.classList.toggle('flipped',albumFlipped);c.setAttribute('aria-pressed',String(albumFlipped));c.setAttribute('aria-label',albumFlipped?'Flip album to front':'Flip album to back')};document.querySelector('#album-back').onclick=()=>close();document.querySelector('#album-back').focus();}
function unfold(){showAlbum(tabs[currentTab].items[positions[currentTab]].id)}
const baseClose=close;close=function(){if(transitionBusy)return;const sh=document.querySelector('.sheet');if(sourceCard&&sh.classList.contains('album-full')){transitionBusy=true;const from=document.querySelector('.album-reverse').getBoundingClientRect(),to=sourceCard.querySelector('.cover').getBoundingClientRect();sh.classList.remove('album-settled');overlay.classList.remove('open');flipFlight(from,to,activeAlbum,true,()=>{sourceCard.style.visibility='';sourceCard=null;sh.classList.remove('album-full');transitionBusy=false;baseClose();stage.querySelector('.record.current').focus()})}else{sh.classList.remove('album-full','album-settled');baseClose()}};
let detailDown=null;const sheetEl=document.querySelector('.sheet');sheetEl.addEventListener('pointerdown',e=>{detailDown={x:e.clientX,y:e.clientY,top:sheetEl.scrollTop}});sheetEl.addEventListener('pointerup',e=>{if(!detailDown)return;let d=e.clientY-detailDown.y,dx=e.clientX-detailDown.x;if(sheetEl.classList.contains('album-full')&&detailDown.top<=1&&d>65&&d>Math.abs(dx))close();detailDown=null});sheetEl.addEventListener('pointercancel',()=>detailDown=null);
let touchStart=null;sheetEl.addEventListener('touchstart',e=>{touchStart={y:e.touches[0].clientY,x:e.touches[0].clientX,top:sheetEl.scrollTop}},{passive:true});sheetEl.addEventListener('touchmove',e=>{if(touchStart&&sheetEl.classList.contains('album-full')&&touchStart.top<=1&&e.touches[0].clientY-touchStart.y>12)e.preventDefault()},{passive:false});sheetEl.addEventListener('touchend',e=>{if(touchStart&&touchStart.top<=1&&e.changedTouches[0].clientY-touchStart.y>65&&Math.abs(e.changedTouches[0].clientX-touchStart.x)<60&&sheetEl.classList.contains('album-full'))close();touchStart=null});
document.querySelector('.close').onclick=()=>close();overlay.onclick=e=>{if(e.target===overlay)close()};
stage.addEventListener('click',e=>{if(suppressClick)return;if(e.target.closest('#prev-record')){move(-1);return}if(e.target.closest('#next-record')){move(1);return}const r=e.target.closest('[data-record]');if(!r)return;let delta=+r.dataset.record-positions[currentTab];if(delta)move(delta);else unfold()});
render();
</script></html>
