<svg xmlns="http://www.w3.org/2000/svg" width="1020" height="1130" viewBox="0 0 1020 1130"><rect width="100%" height="100%" fill="#FBF6EB"/><text id="n1001-line-1" x="40" y="43.5" text-anchor="start" dominant-baseline="central" font-family="Noto Sans SC" font-size="28" font-weight="400" fill="#303D35">Practice · 删除已结束记录</text><text id="n1002-line-1" x="40" y="83.0" text-anchor="start" dominant-baseline="central" font-family="Noto Sans SC" font-size="17" font-weight="400" fill="#303D35">记录详情 → 删除入口 → 确认弹层；取消返回原位置</text><g id="n1003"><rect id="n1003-outline" x="40" y="140" width="390" height="844" rx="28" fill="white" stroke="#DCE1D8" stroke-width="1"/><text id="n1005-line-1" x="64" y="162.5" text-anchor="start" dominant-baseline="central" font-family="Noto Sans SC" font-size="12" font-weight="400" fill="#303D35">9:41</text><text id="n1006-line-1" x="64" y="216.0" text-anchor="start" dominant-baseline="central" font-family="Noto Sans SC" font-size="24" font-weight="400" fill="#303D35">‹</text><text id="n1007-line-1" x="98" y="218.0" text-anchor="start" dominant-baseline="central" font-family="Georgia" font-size="24" font-weight="400" fill="#303D35">Practice record</text><text id="n1008-line-1" x="64" y="276.0" text-anchor="start" dominant-baseline="central" font-family="Noto Sans SC" font-size="13" font-weight="400" fill="#657065">30 Sep 2026 · 9:00 am</text><text id="n1009-line-1" x="64" y="338.0" text-anchor="start" dominant-baseline="central" font-family="Georgia" font-size="27" font-weight="400" fill="#303D35">Letting go</text><text id="n1010-line-1" x="64" y="375.5" text-anchor="start" dominant-baseline="central" font-family="Noto Sans SC" font-size="15" font-weight="400" fill="#303D35">Completed · 12 min</text><text id="n1011-line-1" x="64" y="419.0" text-anchor="start" dominant-baseline="central" font-family="Noto Sans SC" font-size="14" font-weight="400" fill="#303D35">Practiced together</text><rect id="n1012-outline" x="334" y="409" width="18" height="18" rx="9" fill="#E7EDE1" stroke="none" stroke-width="0"/><rect id="n1013-outline" x="340" y="412" width="6" height="6" rx="3" fill="#92A38D" stroke="none" stroke-width="0"/><rect id="n1014-outline" x="338" y="419" width="10" height="5" rx="3" fill="#92A38D" stroke="none" stroke-width="0"/><rect id="n1015-outline" x="354" y="409" width="18" height="18" rx="9" fill="#E7EDE1" stroke="none" stroke-width="0"/><rect id="n1016-outline" x="360" y="412" width="6" height="6" rx="3" fill="#92A38D" stroke="none" stroke-width="0"/><rect id="n1017-outline" x="358" y="419" width="10" height="5" rx="3" fill="#92A38D" stroke="none" stroke-width="0"/><text id="n1018-line-1" x="64" y="510.0" text-anchor="start" dominant-baseline="central" font-family="Noto Sans SC" font-size="14" font-weight="400" fill="#986C60">Delete record</text><rect id="n1019-outline" x="41" y="570" width="388" height="413" rx="24" fill="white" stroke="#303D35" stroke-width="1"/><rect id="n1020-outline" x="214" y="584" width="42" height="4" rx="2" fill="#DCE1D8" stroke="none" stroke-width="0"/><text id="n1021-line-1" x="64" y="634.0" text-anchor="start" dominant-baseline="central" font-family="Georgia" font-size="24" font-weight="400" fill="#303D35">Delete this record?</text><text id="n1022-line-1" x="64" y="684.5" text-anchor="start" dominant-baseline="central" font-family="Noto Sans SC" font-size="15" font-weight="400" fill="#657065">Remove it from your history.</text><text id="n1022-line-2" x="64" y="705.5" text-anchor="start" dominant-baseline="central" font-family="Noto Sans SC" font-size="15" font-weight="400" fill="#657065">Your friends’ records stay unchanged.</text><rect id="n1023-outline" x="64" y="770" width="342" height="44" rx="22" fill="#F8EFEB" stroke="#EADBD4" stroke-width="1"/><text id="n1024-line-1" x="235.0" y="792.0" text-anchor="middle" dominant-baseline="central" font-family="Noto Sans SC" font-size="14" font-weight="400" fill="#986C60">Delete record</text><rect id="n1025-outline" x="64" y="830" width="342" height="44" rx="22" fill="#DCE5D5" stroke="#DCE1D8" stroke-width="1"/><text id="n1026-line-1" x="235.0" y="852.0" text-anchor="middle" dominant-baseline="central" font-family="Noto Sans SC" font-size="14" font-weight="400" fill="#3F5143">Keep record</text></g><text id="n1004-line-1" x="40" y="114.0" text-anchor="start" dominant-baseline="central" font-family="Noto Sans SC" font-size="16" font-weight="400" fill="#303D35">练习记录 · 单人/共同沿用</text><g id="n1027"><rect id="n1027-outline" x="590" y="140" width="390" height="844" rx="28" fill="white" stroke="#DCE1D8" stroke-width="1"/><text id="n1029-line-1" x="614" y="162.5" text-anchor="start" dominant-baseline="central" font-family="Noto Sans SC" font-size="12" font-weight="400" fill="#303D35">9:41</text><text id="n1030-line-1" x="614" y="216.0" text-anchor="start" dominant-baseline="central" font-family="Noto Sans SC" font-size="24" font-weight="400" fill="#303D35">‹</text><text id="n1031-line-1" x="648" y="218.0" text-anchor="start" dominant-baseline="central" font-family="Georgia" font-size="24" font-weight="400" fill="#303D35">Reflection</text><text id="n1032-line-1" x="614" y="276.0" text-anchor="start" dominant-baseline="central" font-family="Noto Sans SC" font-size="13" font-weight="400" fill="#657065">30 Sep 2026 · 9:00 am</text><rect id="n1033-outline" x="614" y="307" width="30" height="30" rx="15" fill="#F3F5EF" stroke="none" stroke-width="0"/><rect id="n1034-outline" x="622" y="316" width="2" height="2" rx="1" fill="#303D35" stroke="none" stroke-width="0"/><rect id="n1035-outline" x="634" y="316" width="2" height="2" rx="1" fill="#303D35" stroke="none" stroke-width="0"/><path id="n1036" d="M 622 325 L 629 329 L 636 325" fill="none" stroke="#303D35" stroke-width="1" stroke-linejoin="round"/><text id="n1037-line-1" x="660" y="323.0" text-anchor="start" dominant-baseline="central" font-family="Noto Sans SC" font-size="14" font-weight="400" fill="#303D35">Good · With a prompt</text><text id="n1038-line-1" x="614" y="388.5" text-anchor="start" dominant-baseline="central" font-family="Georgia" font-size="25" font-weight="400" fill="#303D35">Asking for help</text><text id="n1039-line-1" x="614" y="429.5" text-anchor="start" dominant-baseline="central" font-family="Noto Sans SC" font-size="15" font-weight="400" fill="#303D35">Today I asked for support.</text><text id="n1039-line-2" x="614" y="450.5" text-anchor="start" dominant-baseline="central" font-family="Noto Sans SC" font-size="15" font-weight="400" fill="#303D35">I felt heard, and a little lighter.</text><text id="n1040-line-1" x="614" y="510.0" text-anchor="start" dominant-baseline="central" font-family="Noto Sans SC" font-size="14" font-weight="400" fill="#986C60">Delete reflection</text><rect id="n1041-outline" x="591" y="570" width="388" height="413" rx="24" fill="white" stroke="#303D35" stroke-width="1"/><rect id="n1042-outline" x="764" y="584" width="42" height="4" rx="2" fill="#DCE1D8" stroke="none" stroke-width="0"/><text id="n1043-line-1" x="614" y="634.0" text-anchor="start" dominant-baseline="central" font-family="Georgia" font-size="24" font-weight="400" fill="#303D35">Delete this reflection?</text><text id="n1044-line-1" x="614" y="684.5" text-anchor="start" dominant-baseline="central" font-family="Noto Sans SC" font-size="15" font-weight="400" fill="#657065">Your writing will be removed.</text><text id="n1044-line-2" x="614" y="705.5" text-anchor="start" dominant-baseline="central" font-family="Noto Sans SC" font-size="15" font-weight="400" fill="#657065">Your daily mood will stay on Home.</text><rect id="n1045-outline" x="614" y="770" width="342" height="44" rx="22" fill="#F8EFEB" stroke="#EADBD4" stroke-width="1"/><text id="n1046-line-1" x="785.0" y="792.0" text-anchor="middle" dominant-baseline="central" font-family="Noto Sans SC" font-size="14" font-weight="400" fill="#986C60">Delete reflection</text><rect id="n1047-outline" x="614" y="830" width="342" height="44" rx="22" fill="#DCE5D5" stroke="#DCE1D8" stroke-width="1"/><text id="n1048-line-1" x="785.0" y="852.0" text-anchor="middle" dominant-baseline="central" font-family="Noto Sans SC" font-size="14" font-weight="400" fill="#3F5143">Keep reflection</text></g><text id="n1028-line-1" x="590" y="114.0" text-anchor="start" dominant-baseline="central" font-family="Noto Sans SC" font-size="16" font-weight="400" fill="#303D35">Reflection · 提问/自由记录沿用</text><text id="n1049-line-1" x="40" y="1024.5" text-anchor="start" dominant-baseline="central" font-family="Noto Sans SC" font-size="15" font-weight="400" fill="#303D35">删除成功：回到原日期；刷新列表与条数。删除失败：保留内容，提示 Couldn’t delete. Try again.，可重试。</text><text id="n1050-line-1" x="40" y="1058.5" text-anchor="start" dominant-baseline="central" font-family="Noto Sans SC" font-size="15" font-weight="400" fill="#303D35">提案：删除练习仅影响本人的记录与统计；删除Reflection不删除首页当天心情，也不影响任何Session。</text><text id="n1051-line-1" x="40" y="1092.5" text-anchor="start" dominant-baseline="central" font-family="Noto Sans SC" font-size="15" font-weight="400" fill="#303D35">确认前不删除；提交时禁用重复点击。取消关闭弹层；不批量删除同一专辑、同一天或好友的数据。</text></svg>