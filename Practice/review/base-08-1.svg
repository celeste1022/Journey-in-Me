<svg xmlns="http://www.w3.org/2000/svg" width="550" height="1020" viewBox="0 0 550 1020"><rect width="100%" height="100%" fill="#FBF6EB"/><text id="n1-line-1" x="40" y="42.0" text-anchor="start" dominant-baseline="central" font-family="Noto Sans SC" font-size="26" font-weight="400" fill="#303D35">Practice · Session detail</text><text id="n2-line-1" x="40" y="87.0" text-anchor="start" dominant-baseline="central" font-family="Noto Sans SC" font-size="16" font-weight="400" fill="#657065">图标试听 · 小胶囊按钮</text><g id="n3"><rect id="n3-outline" x="80" y="132" width="390" height="844" rx="24" fill="white" stroke="#303D35" stroke-width="1"/><text id="n4-line-1" x="104" y="152.5" text-anchor="start" dominant-baseline="central" font-family="Noto Sans SC" font-size="12" font-weight="400" fill="#303D35">9:41</text><text id="n5-line-1" x="368" y="152.5" text-anchor="start" dominant-baseline="central" font-family="Noto Sans SC" font-size="12" font-weight="400" fill="#303D35">●  )))  ▰</text><path id="n6" d="M 113 187 L 105 195 L 113 203" fill="none" stroke="#303D35" stroke-width="1.5" stroke-linejoin="round"/><text id="n7-line-1" x="129" y="197.0" text-anchor="start" dominant-baseline="central" font-family="Georgia" font-size="23" font-weight="400" fill="#303D35">Session</text><rect id="n8-outline" x="205" y="240" width="140" height="158" rx="8" fill="#E8ECDF" stroke="#DCE1D8" stroke-width="1"/><rect id="n9-outline" x="213" y="248" width="124" height="142" rx="4" fill="none" stroke="#CCD4C5" stroke-width="1"/><rect id="n10-outline" x="258" y="267" width="34" height="34" rx="17" fill="#D1DAC8" stroke="none" stroke-width="0"/><path id="n11" d="M 224 356 L 257 340 L 290 361 L 327 344" fill="none" stroke="#A0AD96" stroke-width="1.5" stroke-linejoin="round"/><text id="n12-line-1" x="104" y="448.0" text-anchor="start" dominant-baseline="central" font-family="Georgia" font-size="30" font-weight="400" fill="#303D35">Letting go</text><text id="n13-line-1" x="104" y="482.5" text-anchor="start" dominant-baseline="central" font-family="Noto Sans SC" font-size="15" font-weight="400" fill="#657065">Mia · 20 min</text><text id="n14-line-1" x="104" y="519.0" text-anchor="start" dominant-baseline="central" font-family="Noto Sans SC" font-size="14" font-weight="400" fill="#657065">Evening calm · Session 3 of 8</text><path id="n15" d="M 432 513 L 437 518 L 432 523" fill="none" stroke="#657065" stroke-width="1.5" stroke-linejoin="round"/><text id="n16-line-1" x="104" y="569.0" text-anchor="start" dominant-baseline="central" font-family="Georgia" font-size="20" font-weight="400" fill="#303D35">About this session</text><text id="n17-line-1" x="104" y="602.5" text-anchor="start" dominant-baseline="central" font-family="Noto Sans SC" font-size="15" font-weight="400" fill="#303D35">A gentle practice to soften tension</text><text id="n17-line-2" x="104" y="623.5" text-anchor="start" dominant-baseline="central" font-family="Noto Sans SC" font-size="15" font-weight="400" fill="#303D35">and make room for what you need.</text><text id="n17-line-3" x="104" y="644.5" text-anchor="start" dominant-baseline="central" font-family="Noto Sans SC" font-size="15" font-weight="400" fill="#303D35"></text><text id="n17-line-4" x="104" y="665.5" text-anchor="start" dominant-baseline="central" font-family="Noto Sans SC" font-size="15" font-weight="400" fill="#303D35">Follow a few slow breaths, notice</text><text id="n17-line-5" x="104" y="686.5" text-anchor="start" dominant-baseline="central" font-family="Noto Sans SC" font-size="15" font-weight="400" fill="#303D35">where you are holding tension, and</text><text id="n17-line-6" x="104" y="707.5" text-anchor="start" dominant-baseline="central" font-family="Noto Sans SC" font-size="15" font-weight="400" fill="#303D35">let your body settle at its own pace.</text><text id="n17-line-7" x="104" y="728.5" text-anchor="start" dominant-baseline="central" font-family="Noto Sans SC" font-size="15" font-weight="400" fill="#303D35"></text><text id="n17-line-8" x="104" y="749.5" text-anchor="start" dominant-baseline="central" font-family="Noto Sans SC" font-size="15" font-weight="400" fill="#303D35">You can sit or lie down somewhere</text><text id="n17-line-9" x="104" y="770.5" text-anchor="start" dominant-baseline="central" font-family="Noto Sans SC" font-size="15" font-weight="400" fill="#303D35">comfortable. There is nothing to get</text><text id="n17-line-10" x="104" y="791.5" text-anchor="start" dominant-baseline="central" font-family="Noto Sans SC" font-size="15" font-weight="400" fill="#303D35">right, and no need to force a feeling.</text><text id="n18-line-1" x="104" y="831.0" text-anchor="start" dominant-baseline="central" font-family="Noto Sans SC" font-size="14" font-weight="400" fill="#657065">Read less</text><rect id="n19-outline" x="81" y="861" width="388" height="100" rx="0" fill="white" stroke="none" stroke-width="0"/><path id="n20" d="M 81 861 L 469 861" fill="none" stroke="#DCE1D8" stroke-width="1" stroke-linejoin="round"/><rect id="n23-outline" x="220" y="966" width="110" height="4" rx="2" fill="#303D35" stroke="none" stroke-width="0"/><text id="n501-line-1" x="275.0" y="880.5" text-anchor="middle" dominant-baseline="central" font-family="Noto Sans SC" font-size="11" font-weight="400" fill="#657065">15-second preview</text><rect id="n502-outline" x="209" y="897" width="132" height="44" rx="22" fill="#303D35" stroke="none" stroke-width="0"/><path id="n503" d="M 238 911 L 250 919 L 238 927 L 238 911" fill="none" stroke="white" stroke-width="2" stroke-linejoin="round"/><text id="n504-line-1" x="292.0" y="918.5" text-anchor="middle" dominant-baseline="central" font-family="Noto Sans SC" font-size="15" font-weight="400" fill="white">15s</text></g></svg>