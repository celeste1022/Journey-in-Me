class DemoAuth {
  constructor(storage, clock=()=>Date.now()) { this.storage=storage; this.clock=clock; this.users=[]; this.challenge=null; this.grant=null; this.reset=null; this.session=null; }
  read(key, fallback) { try { return JSON.parse(this.storage.getItem(key)) ?? fallback; } catch { return fallback; } }
  write(key, value) { try { this.storage.setItem(key,JSON.stringify(value)); } catch { throw new Error('Your browser could not save this demo. Allow site storage and try again.'); } }
  email(value) { return String(value||'').trim().toLowerCase(); }
  validEmail(value) { return /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(this.email(value)); }
  validPassword(value) { return /^(?=.{8,20}$)(?=.*[A-Za-z])(?=.*\d)(?=.*[^A-Za-z0-9\s])\S+$/.test(value); }
  async hash(password,salt) {
    const key=await crypto.subtle.importKey('raw',new TextEncoder().encode(password),'PBKDF2',false,['deriveBits']);
    const bits=await crypto.subtle.deriveBits({name:'PBKDF2',salt:new TextEncoder().encode(salt),iterations:100000,hash:'SHA-256'},key,256);
    return Array.from(new Uint8Array(bits),b=>b.toString(16).padStart(2,'0')).join('');
  }
  async init() {
    this.users=this.read('mvp-auth-users-v1',[]);
    if(!Array.isArray(this.users))this.users=[];
    if(!this.users.some(u=>u.email==='you@example.com')) {
      const salt='journey-mvp-sample-account';
      this.users.push({id:'sample',email:'you@example.com',name:'Linghui',salt,hash:await this.hash('Journey123!',salt)});
      this.write('mvp-auth-users-v1',this.users);
    }
    const session=this.read('mvp-auth-session-v1',null);
    if(session && this.users.some(u=>u.id===session.id))this.session=session;
    return this.session;
  }
  find(email) { return this.users.find(u=>u.email===this.email(email)); }
  signIn(user,provider='email') {
    const session={id:user.id,email:user.email,name:user.name,provider};
    this.write('mvp-auth-session-v1',session);this.session=session;return session;
  }
  logout() { this.storage.removeItem('mvp-auth-session-v1');this.session=null;this.challenge=null;this.grant=null;this.reset=null; }
  async passwordLogin(email,password) {
    const user=this.find(email);
    if(!user?.hash || await this.hash(password,user.salt)!==user.hash)throw new Error('Incorrect password. Try again or use an email code.');
    return this.signIn(user);
  }
  sendCode(email,purpose='login') {
    email=this.email(email);
    if(!this.validEmail(email))throw new Error('Enter a valid email address.');
    const now=this.clock();
    if(this.challenge?.email===email && this.challenge.purpose===purpose && now<this.challenge.resendAt)throw new Error('Please wait before requesting another code.');
    this.challenge={email,purpose,code:'246810',expiresAt:now+300000,resendAt:now+45000,attempts:0};this.grant=null;
    return this.challenge;
  }
  verifyCode(email,code) {
    const c=this.challenge;
    if(!c || c.email!==this.email(email) || this.clock()>=c.expiresAt)throw new Error('This code has expired. Request a new code.');
    if(c.attempts>=5)throw new Error('Too many attempts. Request a new code.');
    if(code!==c.code){c.attempts++;throw new Error('Incorrect code. Please try again.');}
    this.grant={email:c.email,expiresAt:this.clock()+300000};this.challenge=null;
    const user=this.find(email);
    if(user && c.purpose==='login'){this.grant=null;return {session:this.signIn(user)};}
    if(user)throw new Error('An account already exists. Go back to log in.');
    return {register:true};
  }
  async register(email,password,confirmation) {
    email=this.email(email);
    if(!this.grant || this.grant.email!==email || this.clock()>=this.grant.expiresAt)throw new Error('Verify your email again before creating an account.');
    if(this.find(email))throw new Error('An account already exists. Go back to log in.');
    if(!this.validPassword(password))throw new Error('Use 8–20 characters with letters, numbers and symbols.');
    if(password!==confirmation)throw new Error('Passwords do not match.');
    const salt=crypto.randomUUID();
    const user={id:crypto.randomUUID(),email,name:email.split('@')[0],salt,hash:await this.hash(password,salt)};
    const users=[...this.users,user];this.write('mvp-auth-users-v1',users);this.users=users;this.grant=null;
    return this.signIn(user);
  }
  requestReset(email) {
    email=this.email(email);if(!this.validEmail(email))throw new Error('Enter a valid email address.');
    this.reset={email,token:crypto.randomUUID(),expiresAt:this.clock()+600000,available:!!this.find(email)};return this.reset;
  }
  async resetPassword(token,password,confirmation) {
    const reset=this.reset;
    if(!reset?.available || token!==reset.token || this.clock()>=reset.expiresAt)throw new Error('This reset link has expired. Request a new link.');
    if(!this.validPassword(password))throw new Error('Use 8–20 characters with letters, numbers and symbols.');
    if(password!==confirmation)throw new Error('Passwords do not match.');
    const salt=crypto.randomUUID(), hash=await this.hash(password,salt);
    const users=this.users.map(u=>u.email===reset.email?{...u,salt,hash}:u);this.write('mvp-auth-users-v1',users);this.users=users;this.reset=null;this.logout();
  }
  social(provider) {
    const email=provider.toLowerCase()+'@example.com';let user=this.find(email);
    if(!user){user={id:'demo-'+provider.toLowerCase(),name:provider+' demo',email};const users=[...this.users,user];this.write('mvp-auth-users-v1',users);this.users=users;}
    return this.signIn(user,provider);
  }
}

let active='home';const f=document.getElementById('journey-content');
window.mvpEntry='home';window.MVP_DOCS={};window.authEntry='welcome';let returnTo='home';
const routes=['home','practice','my','my-speaker','speaker','reflection'];
function accountKey(key){const id=window.MVP_AUTH?.session?.id;return id&&id!=='sample'?key+'-'+id:key;}
function accountDocument(content){const id=window.MVP_AUTH?.session?.id;if(!id||id==='sample')return content;return content.replaceAll('mvp-practice-','mvp-practice-'+id+'-').replaceAll('mvp-my-demo-settings',accountKey('mvp-my-demo-settings')).replaceAll('mvp-journey-device',accountKey('mvp-journey-device'));}
function navigate(route){if(!MVP_DOCS.home)return;if(!routes.includes(route)&&route!=='onboarding')route='home';if(!MVP_AUTH.session){if(route!=='onboarding')returnTo=route;route='onboarding';}else if(route==='onboarding')route='home';window.mvpEntry=route;active=route==='reflection'?'practice':route==='my-speaker'?'my':route==='onboarding'?'auth':route;document.querySelector('.journey-phone').classList.toggle('auth-mode',active==='auth');f.srcdoc=accountDocument(MVP_DOCS[active]);f.title=active==='auth'?'Account onboarding':active==='my'?'My account':active;location.hash=route;document.querySelectorAll('.journey-nav a').forEach(a=>a.setAttribute('aria-current',a.dataset.route===(active==='practice'?'practice':'home')?'page':'false'));}
window.completeDemoLogin=()=>{let device;try{device=JSON.parse(localStorage.getItem(accountKey('mvp-journey-device')));}catch{}navigate(device?.online||device?.onboardingSeen?returnTo:'speaker');};
window.logoutDemo=()=>{MVP_AUTH.logout();window.authEntry='entry';returnTo='home';navigate('onboarding');};
document.querySelectorAll('.journey-nav a').forEach(a=>{a.dataset.route=a.getAttribute('href').replace('/','');a.href='#'+a.dataset.route;a.onclick=e=>{e.preventDefault();navigate(a.dataset.route)}});
window.addEventListener('message',e=>{if(e.source!==f.contentWindow)return;if(e.data?.channel==='mvp-route')navigate(e.data.route);if(e.data?.channel==='home-my')navigate('my');if(e.data?.channel==='home-speaker')navigate('my-speaker')});
window.addEventListener('hashchange',()=>{const next=location.hash.slice(1);if(next!==mvpEntry&&MVP_DOCS.home)navigate(next)});
async function boot(){try{window.MVP_AUTH=new DemoAuth(localStorage);await MVP_AUTH.init();const bin=Uint8Array.from(atob(PAYLOAD),c=>c.charCodeAt(0));const result=new Response(new Blob([bin]).stream().pipeThrough(new DecompressionStream('gzip')));MVP_DOCS=JSON.parse(await result.text());document.getElementById('loading').remove();navigate(routes.includes(location.hash.slice(1))?location.hash.slice(1):'home');}catch(e){const loading=document.getElementById('loading');if(loading)loading.textContent='Please use a current browser with site storage enabled to open this demo.';console.error(e)}}
boot();
</script></body></html>
