let active='home';const f=document.getElementById('journey-content');
window.mvpEntry='home';window.MVP_DOCS={};
function navigate(route){if(!['home','practice','my','my-speaker','speaker','reflection'].includes(route))return;window.mvpEntry=route;active=route==='reflection'?'practice':route==='my-speaker'?'my':route;f.srcdoc=MVP_DOCS[active];f.title=active==='my'?'My account':active;location.hash=route;document.querySelectorAll('.journey-nav a').forEach(a=>a.setAttribute('aria-current',a.dataset.route===(active==='practice'?'practice':'home')?'page':'false'));}
document.querySelectorAll('.journey-nav a').forEach(a=>{a.dataset.route=a.getAttribute('href').replace('/','');a.href='#'+a.dataset.route;a.onclick=e=>{e.preventDefault();navigate(a.dataset.route)}});
window.addEventListener('message',e=>{if(e.source!==f.contentWindow)return;if(e.data?.channel==='mvp-route')navigate(e.data.route);if(e.data?.channel==='home-my')navigate('my');if(e.data?.channel==='home-speaker')navigate('my-speaker')});
window.addEventListener('hashchange',()=>{const next=location.hash.slice(1);if(next!==mvpEntry&&MVP_DOCS.home)navigate(next)});
async function boot(){try{const bin=Uint8Array.from(atob(PAYLOAD),c=>c.charCodeAt(0));const result=new Response(new Blob([bin]).stream().pipeThrough(new DecompressionStream('gzip')));MVP_DOCS=JSON.parse(await result.text());document.getElementById('loading').remove();navigate(['home','practice','my','my-speaker','speaker','reflection'].includes(location.hash.slice(1))?location.hash.slice(1):'home');}catch(e){document.getElementById('loading').textContent='Please open this demo in a current version of Chrome, Edge or Safari.';console.error(e)}}
boot();
